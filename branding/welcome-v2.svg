<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Welcome Picture v2: заголовок и гарантии слева, живой экран приложения справа -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1240"/>
      <stop offset="0.55" stop-color="#3A1659"/>
      <stop offset="1" stop-color="#5A1A52"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF7A59" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FF7A59" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C2477E" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#C2477E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5B4BFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5B4BFF" stop-opacity="0"/>
    </radialGradient>

    <!-- иконка приложения (как аватарка) -->
    <linearGradient id="iSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B1B6B"/>
      <stop offset="0.45" stop-color="#C2477E"/>
      <stop offset="0.75" stop-color="#FF9A5A"/>
    </linearGradient>
    <clipPath id="iconClip"><rect width="1024" height="1024" rx="230"/></clipPath>

    <!-- сцены для миниатюр (100×100) -->
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB347"/><stop offset="1" stop-color="#FF5E62"/></linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5AC8FA"/><stop offset="1" stop-color="#C9EEFF"/></linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E1A5C"/><stop offset="1" stop-color="#6A4BD9"/></linearGradient>
    <linearGradient id="s4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9BE7B0"/><stop offset="1" stop-color="#2FAE7E"/></linearGradient>
    <linearGradient id="s5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FD6FF"/><stop offset="1" stop-color="#3AA0E8"/></linearGradient>
    <linearGradient id="s6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8FB1"/><stop offset="1" stop-color="#7B3FD9"/></linearGradient>
    <linearGradient id="s7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE29A"/><stop offset="1" stop-color="#FF9F43"/></linearGradient>
    <linearGradient id="s8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9C6FF"/><stop offset="1" stop-color="#EAF2FF"/></linearGradient>

    <symbol id="sunset" viewBox="0 0 100 100"><rect width="100" height="100" fill="url(#s1)"/><circle cx="50" cy="58" r="16" fill="#FFE29A"/><rect y="62" width="100" height="38" fill="#B0306A"/><rect x="30" y="68" width="40" height="3" rx="1.5" fill="#FFE29A" opacity="0.6"/><rect x="38" y="76" width="24" height="3" rx="1.5" fill="#FFE29A" opacity="0.4"/></symbol>
    <symbol id="mount" viewBox="0 0 100 100"><rect width="100" height="100" fill="url(#s2)"/><circle cx="74" cy="26" r="10" fill="#FFD60A"/><path d="M0 85 L30 45 L50 68 L66 50 L100 88 L100 100 L0 100 Z" fill="#34C759"/><path d="M0 100 L0 90 C30 78 60 82 100 92 L100 100 Z" fill="#1E9E45"/></symbol>
    <symbol id="night" viewBox="0 0 100 100"><rect width="100" height="100" fill="url(#s3)"/><circle cx="70" cy="28" r="11" fill="#FFF6D5"/><circle cx="64" cy="24" r="10" fill="#2E2470"/><circle cx="20" cy="20" r="1.5" fill="#fff"/><circle cx="36" cy="34" r="1.2" fill="#fff"/><circle cx="84" cy="52" r="1.2" fill="#fff"/><path d="M0 100 L0 74 L14 74 L14 60 L26 60 L26 70 L40 70 L40 52 L52 52 L52 72 L66 72 L66 62 L80 62 L80 76 L100 76 L100 100 Z" fill="#120E33"/></symbol>
    <symbol id="forest" viewBox="0 0 100 100"><rect width="100" height="100" fill="url(#s4)"/><path d="M15 90 L28 40 L41 90 Z" fill="#167A4A"/><path d="M38 95 L55 30 L72 95 Z" fill="#0F6A3E"/><path d="M66 92 L80 50 L94 92 Z" fill="#167A4A"/><rect y="88" width="100" height="12" fill="#0B4F2E"/></symbol>
    <symbol id="beach" viewBox="0 0 100 100"><rect width="100" height="100" fill="url(#s5)"/><rect y="52" width="100" height="22" fill="#1C7ED6"/><path d="M0 70 C30 64 70 66 100 72 L100 100 L0 100 Z" fill="#F7D79A"/><circle cx="24" cy="24" r="9" fill="#FFF"/></symbol>
    <symbol id="city" viewBox="0 0 100 100"><rect width="100" height="100" fill="url(#s6)"/><path d="M0 100 L0 62 L12 62 L12 46 L24 46 L24 66 L34 66 L34 36 L46 36 L46 58 L58 58 L58 44 L70 44 L70 64 L82 64 L82 52 L100 52 L100 100 Z" fill="#2A1450"/><g fill="#FFD27A"><rect x="37" y="42" width="3" height="3"/><rect x="41" y="48" width="3" height="3"/><rect x="61" y="50" width="3" height="3"/><rect x="15" y="52" width="3" height="3"/><rect x="86" y="58" width="3" height="3"/></g></symbol>
    <symbol id="flower" viewBox="0 0 100 100"><rect width="100" height="100" fill="url(#s7)"/><rect x="48" y="50" width="4" height="50" fill="#2FAE7E"/><g fill="#FF5E7E"><circle cx="50" cy="34" r="10"/><circle cx="62" cy="44" r="10"/><circle cx="50" cy="54" r="10"/><circle cx="38" cy="44" r="10"/></g><circle cx="50" cy="44" r="7" fill="#FFD60A"/></symbol>
    <symbol id="snow" viewBox="0 0 100 100"><rect width="100" height="100" fill="url(#s8)"/><path d="M0 100 L0 70 L35 30 L55 55 L70 40 L100 75 L100 100 Z" fill="#5C7CC9"/><path d="M35 30 L45 42 L38 44 L30 37 Z M70 40 L78 49 L72 50 Z" fill="#fff"/><path d="M0 100 C30 88 70 90 100 96 L100 100 Z" fill="#fff"/></symbol>

    <clipPath id="screen"><rect x="14" y="14" width="312" height="672" rx="46"/></clipPath>
    <linearGradient id="tabFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A4A55"/>
      <stop offset="0.5" stop-color="#1C1C22"/>
      <stop offset="1" stop-color="#3A3A44"/>
    </linearGradient>
    <filter id="phoneShadow" x="-40%" y="-20%" width="180%" height="140%">
      <feDropShadow dx="-10" dy="30" stdDeviation="34" flood-color="#0A0420" flood-opacity="0.6"/>
    </filter>
    <filter id="soft" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0A0420" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- фон -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="980" cy="560" r="460" fill="url(#glowA)"/>
  <circle cx="1120" cy="120" r="380" fill="url(#glowB)"/>
  <circle cx="120" cy="80" r="420" fill="url(#glowC)"/>

  <!-- ===== левая колонка ===== -->
  <g transform="translate(96 108)">
    <!-- иконка -->
    <g transform="scale(0.086)" filter="url(#soft)">
      <g clip-path="url(#iconClip)">
        <rect width="1024" height="1024" fill="url(#iSky)"/>
        <circle cx="512" cy="610" r="130" fill="#FFE29A"/>
        <path d="M0 700 L230 520 L380 640 L520 540 L700 680 L830 590 L1024 720 L1024 1024 L0 1024 Z" fill="#6B2C7A"/>
        <path d="M0 800 C200 720 380 740 540 790 C700 840 860 780 1024 760 L1024 1024 L0 1024 Z" fill="#3B1650"/>
        <g fill="none" stroke="#fff" stroke-width="56" stroke-linecap="round" stroke-linejoin="round">
          <path d="M250 370 V290 Q250 250 290 250 H370"/>
          <path d="M654 250 H734 Q774 250 774 290 V370"/>
          <path d="M774 654 V734 Q774 774 734 774 H654"/>
          <path d="M370 774 H290 Q250 774 250 734 V654"/>
        </g>
      </g>
    </g>

    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#fff">
      <text x="-4" y="198" font-size="92" font-weight="700" letter-spacing="-1.5">Фотоплёнка</text>
      <text x="0" y="252" font-size="31" font-weight="400" fill="#fff" opacity="0.78">Ваши фото с Яндекс Диска —</text>
      <text x="0" y="292" font-size="31" font-weight="400" fill="#fff" opacity="0.78">в галерее, как на iPhone</text>
    </g>

    <!-- гарантии -->
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#fff">
      <!-- 1: только просмотр -->
      <g transform="translate(0 350)">
        <rect width="372" height="56" rx="28" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.18" stroke-width="1.5"/>
        <g transform="translate(22 14)" fill="none" stroke="#FFD27A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 14 C5 6 10 3 14 3 C18 3 23 6 27 14 C23 22 18 25 14 25 C10 25 5 22 1 14 Z"/>
          <circle cx="14" cy="14" r="4.5"/>
        </g>
        <text x="66" y="37">Только просмотр</text>
      </g>
      <!-- 2: видите только вы -->
      <g transform="translate(0 420)">
        <rect width="372" height="56" rx="28" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.18" stroke-width="1.5"/>
        <g transform="translate(24 12)" fill="none" stroke="#FFD27A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="13" width="22" height="17" rx="4"/>
          <path d="M6 13 V9 C6 5 8.5 2.5 12 2.5 C15.5 2.5 18 5 18 9 V13"/>
        </g>
        <text x="66" y="37">Фото видите только вы</text>
      </g>
    </g>
  </g>

  <!-- ===== телефон ===== -->
  <g transform="translate(800 92) rotate(-7 170 350)" filter="url(#phoneShadow)">
    <rect width="340" height="700" rx="58" fill="url(#frame)"/>
    <rect x="3" y="3" width="334" height="694" rx="55" fill="#0B0B0F"/>
    <g clip-path="url(#screen)">
      <rect x="14" y="14" width="312" height="672" fill="#000"/>
      <!-- сетка 3 колонки, как «Все фото» -->
      <g>
        <use xlink:href="#city"   x="14"  y="14"  width="103" height="103"/>
        <use xlink:href="#snow"   x="118.5" y="14"  width="103" height="103"/>
        <use xlink:href="#beach"  x="223" y="14"  width="103" height="103"/>

        <use xlink:href="#forest" x="14"  y="118.5" width="103" height="103"/>
        <use xlink:href="#sunset" x="118.5" y="118.5" width="103" height="103"/>
        <use xlink:href="#flower" x="223" y="118.5" width="103" height="103"/>

        <use xlink:href="#mount"  x="14"  y="223" width="103" height="103"/>
        <use xlink:href="#night"  x="118.5" y="223" width="103" height="103"/>
        <use xlink:href="#snow"   x="223" y="223" width="103" height="103"/>

        <use xlink:href="#beach"  x="14"  y="327.5" width="103" height="103"/>
        <use xlink:href="#flower" x="118.5" y="327.5" width="103" height="103"/>
        <use xlink:href="#city"   x="223" y="327.5" width="103" height="103"/>

        <use xlink:href="#sunset" x="14"  y="432" width="103" height="103"/>
        <use xlink:href="#forest" x="118.5" y="432" width="103" height="103"/>
        <use xlink:href="#mount"  x="223" y="432" width="103" height="103"/>

        <use xlink:href="#night"  x="14"  y="536.5" width="103" height="103"/>
        <use xlink:href="#mount"  x="118.5" y="536.5" width="103" height="103"/>
        <use xlink:href="#sunset" x="223" y="536.5" width="103" height="103"/>

        <use xlink:href="#snow"   x="14"  y="641" width="103" height="103"/>
        <use xlink:href="#city"   x="118.5" y="641" width="103" height="103"/>
        <use xlink:href="#forest" x="223" y="641" width="103" height="103"/>
      </g>

      <!-- верх: статус-бар и заголовок поверх фото -->
      <rect x="14" y="14" width="312" height="190" fill="url(#topFade)"/>
      <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#fff">
        <text x="44" y="48" font-size="15" font-weight="600">9:41</text>
        <text x="32" y="104" font-size="30" font-weight="700">Все фото</text>
        <text x="32" y="126" font-size="13" font-weight="500" opacity="0.85">12 482 объекта</text>
      </g>
      <!-- статус-бар справа -->
      <g fill="#fff" transform="translate(262 37)">
        <rect x="0" y="6" width="3" height="5" rx="1"/><rect x="5" y="4" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="9" rx="1"/>
        <rect x="20" y="1" width="22" height="11" rx="3.5" fill="none" stroke="#fff" stroke-width="1.4" opacity="0.9"/>
        <rect x="22" y="3" width="16" height="7" rx="2"/>
      </g>
      <!-- Dynamic Island -->
      <rect x="125" y="27" width="90" height="26" rx="13" fill="#000"/>
    </g>
    <!-- блик на стекле -->
    <path d="M14 60 Q14 14 60 14 L200 14 L60 686 L60 686 Q14 686 14 640 Z" fill="#fff" opacity="0.04"/>
  </g>
</svg>
