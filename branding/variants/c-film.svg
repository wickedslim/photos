    </g>
    <!-- кадр 3: ночь -->
    <g clip-path="url(#c3)">
      <rect x="130" y="-110" width="200" height="220" fill="url(#f3)"/>
      <circle cx="270" cy="-50" r="26" fill="#FFF6D5"/>
