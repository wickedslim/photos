      <rect x="300" y="-160" width="34" height="34" rx="8"/>
      <rect x="360" y="-160" width="34" height="34" rx="8"/>
      <rect x="420" y="-160" width="34" height="34" rx="8"/>
      <rect x="480" y="-160" width="34" height="34" rx="8"/>
      <rect x="540" y="-160" width="34" height="34" rx="8"/>
      <rect x="-600" y="126" width="34" height="34" rx="8"/>
      <rect x="-540" y="126" width="34" height="34" rx="8"/>
      <rect x="-480" y="126" width="34" height="34" rx="8"/>
      <rect x="-420" y="126" width="34" height="34" rx="8"/>
      <rect x="-360" y="126" width="34" height="34" rx="8"/>
      <rect x="-300" y="126" width="34" height="34" rx="8"/>
      <rect x="-240" y="126" width="34" height="34" rx="8"/>
      <rect x="-180" y="126" width="34" height="34" rx="8"/>
      <rect x="-120" y="126" width="34" height="34" rx="8"/>
      <rect x="-60" y="126" width="34" height="34" rx="8"/>
      <rect x="0" y="126" width="34" height="34" rx="8"/>
