<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Фотоплёнка: диагональная плёнка с тремя кадрами -->
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.25" r="1">
      <stop offset="0" stop-color="#3A3A46"/>
      <stop offset="1" stop-color="#121216"/>
    </radialGradient>
    <linearGradient id="f1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB347"/><stop offset="1" stop-color="#FF5E62"/>
    </linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AC8FA"/><stop offset="1" stop-color="#B8E8FF"/>
    </linearGradient>
    <linearGradient id="f3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A18CFF"/><stop offset="1" stop-color="#5B3FD9"/>
    </linearGradient>
    <clipPath id="c1"><rect x="-330" y="-110" width="200" height="220" rx="22"/></clipPath>
    <clipPath id="c2"><rect x="-100" y="-110" width="200" height="220" rx="22"/></clipPath>
    <clipPath id="c3"><rect x="130" y="-110" width="200" height="220" rx="22"/></clipPath>
