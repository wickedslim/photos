      <stop offset="0" stop-color="#2B1B6B"/>
      <stop offset="0.45" stop-color="#C2477E"/>
      <stop offset="0.75" stop-color="#FF9A5A"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE7A3" stop-opacity="0.9"/>
